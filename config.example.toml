listen = "0.0.0.0:9094"
request_timeout = "5s"

[channels.feishu]
type = "feishu"
webhook = "https://open.feishu.cn/open-apis/bot/v2/hook/xxxx"
secret = ""

[channels.bark]
type = "bark"
server = "https://api.day.app"
key = "xxxx"

[[route]]
match = { severity = "critical" }
channels = ["bark", "feishu"]

[[route]]
match = {}
channels = ["feishu"]
